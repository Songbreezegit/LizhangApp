# 依据实际 Nginx 日志、轮转、系统日志及已保存的 Cloudflare DNS only 记录填写。
# confirmed 仅代表日志事实核对，不代表法律全文或网站发布批准。
website_log_scope=Nginx 访问日志记录来源 IP、远程认证用户名（未启用网站账号或 HTTP 认证时通常为空）、访问时间、HTTP 请求行（可能含请求方法、路径、查询参数和协议版本）、HTTP 状态码、响应正文大小、来源页面 Referer 及浏览器 User-Agent；warn 及以上级别错误日志可能包含错误时间、原因和连接或请求上下文，例如来源 IP、请求路径。主机另有用于服务维护和安全排查的运行、安全及内核日志。这些日志不采集礼账应用的本机联系人、礼金记录或备份文件
website_log_retention=Nginx 日志按每日计划对非空文件轮转，保留 14 份已轮转文件及当前文件，延后一轮压缩，超过轮转份数时删除最旧文件；空文件不轮转，实际保存时间受访问情况和调度执行影响，因此不承诺固定第 14 天删除。相关 rsyslog 主机日志按每周计划轮转、保留 4 份轮转文件，空文件不轮转；systemd-journald 另按系统容量限制回收，当前没有统一固定的按日保存上限。必要接入服务提供方按其适用服务规则处理自身运行或解析记录，其期限不等同于本机 Nginx 的轮转份数
website_service_providers=阿里云提供 ECS 主机和必要网络基础设施，Nginx 在该主机上返回静态页面并记录上述网站日志。Cloudflare 提供域名的权威 DNS 解析，处理完成域名解析所需的信息；本网站采用 DNS only，不通过 Cloudflare 代理 HTTP/HTTPS 页面访问。上述接入不提供礼账应用账号、云端账本或业务数据同步，网站日志与应用本机账本不关联
website_log_review_status=confirmed
