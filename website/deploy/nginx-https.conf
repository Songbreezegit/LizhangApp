# 仅为待授权生产模板。须先存在对应真实证书，核对现有站点、目录和权限再启用。
# 公网配置不继承回环审核站点的 X-Robots-Tag。IPv6 监听仅在 IPv6/DNS/防火墙单独核验后增加。
server {
    listen 443 ssl;
    server_name lizhang.songisle.xyz;
    root /var/www/lizhang-privacy/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/lizhang.songisle.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lizhang.songisle.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    autoindex off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    access_log /var/log/nginx/lizhang-privacy-access.log;
    error_log /var/log/nginx/lizhang-privacy-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ (^|/)\. { deny all; }
    location ~* \.(?:bak|backup|old|orig|save|swp|tmp|sql|sqlite|db|env|ini|conf|pem|key|crt|p12|pfx|log|sh|ya?ml|toml)(?:$|/) { deny all; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
