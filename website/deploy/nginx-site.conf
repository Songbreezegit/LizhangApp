# 备案前专用站点：只能通过本机或 SSH 本地隧道访问。
server {
    listen 127.0.0.1:8080;
    server_name lizhang.songisle.xyz localhost;
    root /srv/lizhang-docs/site/current;
    index index.html;
    access_log off;
    server_tokens off;
    client_max_body_size 1k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
    location ~ /\. { return 404; }
    location ~* \.(md|map|sh|py|ps1|env|bak|tar|gz|zip|ya?ml)$ { return 404; }
}
