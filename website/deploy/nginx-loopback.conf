# 对接 ecs-ops 的目录、日志和 127.0.0.1:8080 规划。仅为待审阅模板，本轮未安装或应用。
# 与 ecs-ops 托管占位站点是同一监听角色；下轮须审阅后替换准确站点，不能同时启用两个 default_server。
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /var/www/lizhang-privacy/current;
    index index.html;
    server_tokens off;
    autoindex off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    access_log /var/log/nginx/lizhang-privacy-access.log;
    error_log /var/log/nginx/lizhang-privacy-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ (^|/)\. { deny all; }
    location ~* \.(?:bak|backup|old|orig|save|swp|tmp|sql|sqlite|db|env|ini|conf|pem|key|crt|p12|pfx|log|sh|ya?ml|toml)(?:$|/) { deny all; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
