# 部署用户无 sudo：测试同一份站点配置，仅 PID 路径和工作进程身份不同。
worker_processes auto;
pid /srv/lizhang-docs/site/.nginx-validation/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    # nginx -t 会检查或创建临时路径；不可依赖 www-data 所有的默认目录。
    client_body_temp_path /srv/lizhang-docs/site/.nginx-validation/client_body;
    proxy_temp_path /srv/lizhang-docs/site/.nginx-validation/proxy;
    fastcgi_temp_path /srv/lizhang-docs/site/.nginx-validation/fastcgi;
    uwsgi_temp_path /srv/lizhang-docs/site/.nginx-validation/uwsgi;
    scgi_temp_path /srv/lizhang-docs/site/.nginx-validation/scgi;
    sendfile on;
    keepalive_timeout 30;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /etc/lizhang-docs/site.conf;
}
