# 仅在备案/接入、DNS、80/443、公网发布及证书条件另获授权后启用。
# 首次 HTTP-01 签发前：临时将 location / 的重定向改为 return 404；不公开审核产物。
server {
    listen 80;
    server_name lizhang.songisle.xyz;
    server_tokens off;
    autoindex off;
    client_max_body_size 128k;
    access_log /var/log/nginx/lizhang-privacy-access.log;
    error_log /var/log/nginx/lizhang-privacy-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lizhang-privacy/acme;
        default_type text/plain;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location / { return 301 https://lizhang.songisle.xyz$request_uri; }
}
